apiVersion: apps/v1
kind: Deployment
metadata:
  name: genieacs-server
  namespace: genieacs
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 2, maxUnavailable: 0 }
  selector:
    matchLabels: { app: genieacs-server }
  template:
    metadata:
      labels: { app: genieacs-server }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: genieacs-server }
      containers:
        - name: genieacs-server
          image: drumsergio/genieacs:1.2.16.0
          ports:
            - { name: cwmp, containerPort: 7547 }
            - { name: nbi,  containerPort: 7557 }
            - { name: fs,   containerPort: 7567 }
          env:
            - name: GENIEACS_MONGODB_CONNECTION_URL
              value: mongodb://genieacs-mongo:27017/genieacs
            - name: GENIEACS_UI_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: genieacs-secrets, key: jwt-secret }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 7547 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 7547 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: genieacs-server
  namespace: genieacs
spec:
  type: ClusterIP
  selector: { app: genieacs-server }
  ports:
    - { name: cwmp, port: 7547, targetPort: 7547 }
    - { name: nbi,  port: 7557, targetPort: 7557 }
    - { name: fs,   port: 7567, targetPort: 7567 }
---
# CPE-der jonno public (sessionAffinity nai: load sob pod-e ber-ber hoye distribute hobe): CWMP (30747) ar File Server (30767). Port number purono-ta-i rakha hoyeche,
# tai CPE-te ACS URL change korte hobe na.
apiVersion: v1
kind: Service
metadata:
  name: genieacs-cpe
  namespace: genieacs
spec:
  type: NodePort
  # externalTrafficPolicy: Local     # CPE-r real IP dorkar hole uncomment korun (pod-hin node-e traffic drop hoy)
  selector: { app: genieacs-server }
  ports:
    - { name: cwmp, port: 7547, targetPort: 7547, nodePort: 30747 }
    - { name: fs,   port: 7567, targetPort: 7567, nodePort: 30767 }
