apiVersion: apps/v1
kind: Deployment
metadata:
  name: genieacs-ui
  namespace: genieacs
spec:
  replicas: 1
  selector:
    matchLabels: { app: genieacs-ui }
  template:
    metadata:
      labels: { app: genieacs-ui }
    spec:
      containers:
        - name: genieacs-ui
          image: drumsergio/genieacs:1.2.16.0
          ports:
            - containerPort: 3000
          env:
            - name: GENIEACS_SERVER_URL
              value: http://genieacs-server:7547
            - name: GENIEACS_MONGODB_CONNECTION_URL
              value: mongodb://genieacs-mongo:27017/genieacs
            - name: GENIEACS_UI_PORT
              value: "3000"
            - name: GENIEACS_UI_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: genieacs-secrets, key: jwt-secret }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: genieacs-ui
  namespace: genieacs
spec:
  type: NodePort
  selector: { app: genieacs-ui }
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30030 }
